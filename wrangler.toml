# The receipts GitHub App's webhook. Deploy: npm run build && npx wrangler@4.157.0 deploy
# Secrets (never in this file): npx wrangler@4.157.0 secret put PRIVATE_KEY, and WEBHOOK_SECRET.
name = "receipts-github"
main = "dist/worker.js"
no_bundle = true
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
APP_ID = "0"

[observability]
enabled = true
